<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link href="https://fonts.googleapis.com/css?family=Roboto|Sriracha&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <img class="bg" src="" alt="">
    <div class="container">
        <h1>Patient Registration Form</h1>
        <form action="index.php" method="post">
            <!-- Personal Information -->
            <div class="row">
                <div class="input-group">
                    <label for="name">First Name</label>
                    <input type="text" name="first_name" id="name" placeholder="First Name" required>
                </div>
                <div class="input-group">
                    <label for="last-name">Last Name</label>
                    <input type="text" name="last_name" id="last-name" placeholder="Last Name" required>
                </div>
            </div>

            <!-- Age and Gender -->
            <div class="row">
                <div class="input-group">
                    <label for="age">Age</label>
                    <input type="number" name="age" id="age" placeholder="Enter patient's age" required min="0" max="120">
                </div>
                <div class="input-group">
                    <label for="gender">Gender</label>
                    <select name="gender" id="gender" required>
                        <option value="">Select Gender</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                        <option value="other">Other</option>
                    </select>
                </div>
            </div>

            <!-- Email and Phone in a Row -->
            <div class="row">
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" name="email" id="email" placeholder="Enter email" required>
                </div>
                <div class="input-group">
                    <label for="phone">Phone</label>
                    <input type="tel" name="phone" id="phone" placeholder="Enter phone number" required>
                </div>
            </div>

            <!-- Additional Information -->
            <label for="desc">Additional Information</label>
            <textarea name="desc" id="desc" cols="30" rows="10" placeholder="Enter any other information here"></textarea>

            <!-- Submit Button -->
            <button class="btn" type="submit">Submit</button>
        </form>
    </div>
</body>
</html>
